services:
  postgres:
    image: postgres:16
    container_name: chatter-postgres
    environment:
      POSTGRES_USER: chatter
      POSTGRES_PASSWORD: chatter
      POSTGRES_DB: chatter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: chatter-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: